apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-product-secrets
  namespace: ecommerce-product
spec:
  provider: aws

  parameters:
    region: us-east-1
    usePodIdentity: "true"
    objects: |
      - objectName: "ecommerce/prod/product"
        objectType: "secretsmanager"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: SECRET_KEY
            objectAlias: SECRET_KEY
          - path: ALGORITHM
            objectAlias: ALGORITHM
          - path: FRONTEND_URL
            objectAlias: FRONTEND_URL

  secretObjects:
    - secretName: ecommerce-product-credentials
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: SECRET_KEY
          key: SECRET_KEY
        - objectName: ALGORITHM
          key: ALGORITHM
        - objectName: FRONTEND_URL
          key: FRONTEND_URL
