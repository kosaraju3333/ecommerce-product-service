apiVersion: v1
kind: Service
metadata:
  name: ecommerce-product-service
  ### Namespace containing your product Deployment
  namespace: ecommerce-product
  labels:
    app: ecommerce-product

spec:
  ### Exposes product Service internally
  type: ClusterIP

  ### Routes traffic to Pods with this label
  selector:
    app: ecommerce-product

  ports:
    - name: http
      protocol: TCP
      ### Port exposed by the Kubernetes Service
      port: 8002
      ### FastAPI container port
      targetPort: 8002
